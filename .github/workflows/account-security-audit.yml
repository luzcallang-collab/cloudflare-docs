name: Account and Cloudflare Security Audit
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: ['production','main','master']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 100}
      - name: Audit repository email identity
        run: |
          set -euo pipefail
          git log --format='%ae' -n 100 | sort -fu | while IFS= read -r email; do
            [[ -z "$email" ]] && continue
            [[ "$email" =~ ^[^@[:space:]]+@users\.noreply\.github\.com$ ]] && echo "OK GitHub noreply: $email" || echo "REVIEW commit email: $email"
          done
      - name: Audit Cloudflare zone when configured
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ZONE_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}" | python -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result") or {}; assert d.get("success"); print("Cloudflare zone:",r.get("name"),"status:",r.get("status"))'
      - name: Cloudflare audit skipped when unconfigured
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ZONE_ID == '' }}
        run: echo 'Configure CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ZONE_ID variable to enable Cloudflare checks.'
